# Step template: Setup Node.js environment
# Installs Node.js, sets up npm cache, and runs clean install
steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: "Install Node.js"

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)
    displayName: "Cache npm"

  - task: Npm@1
    inputs:
      command: "ci"
    displayName: "npm ci"
