trigger: none
pr: none

schedules:
  - cron: "0 4 * * *"
    displayName: "Nightly Acceptance Tests (04:00 UTC)"
    branches:
      include:
        - master
    always: true

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "qa"
    values:
      - dev
      - qa
      - staging
  - name: executionMode
    displayName: "Execution Mode"
    type: string
    default: "local-agent"
    values:
      - azure-workspace # Playwright Workspaces (Cloud - parallel execution)
      - local-agent # Local VM in 'Automated Testing' pool
  - name: testCaseIds
    displayName: "Test Case IDs (comma-separated, e.g., 183011,183012,183013)"
    type: string
    default: " "
  - name: testFilter
    displayName: "Test Filter (Business Category) - ignored if Test Case IDs are set"
    type: string
    default: "@acceptance"
    values:
      - "@acceptance" # Acceptance tests (default)
      - "@keywordValidation" # All stable tests
      - "@coreBusiness" # Core Business tests
      - "@smoke" # Smoke tests only
      - "@aufgaben" # Tasks, Journal, Ziele
      - "@bedarfspruefung" # Anspruchsprüfung, Soforthilfe
      - "@bewilligung" # Bewilligungsworkflow
      - "@dokumente" # Dokumenteingang, Briefe
      - "@dossier" # Dossier-Management
      - "@erwerbsintegration" # FEV
      - "@klient" # Personendaten, Einnahmen, Vermögen
      - "@kontakte" # Institutionen, Bezugspersonen
      - "@kostengutsprache" # KG, SL
      - "@rahmenbudget" # Budget, GBL, Freibetrag
      - "@rechtsverfolgung" # Ermittlung, Beschwerde
      - "@wohnsituation" # Wohnung, Haushalt
      - "@zahlungen" # Zahlungen, Buchungen, WSH
  - name: reportingRun
    displayName: "Reporting Run (video + trace + screenshots for test designer review)"
    type: boolean
    default: false
  - name: workers
    displayName: "Parallel Workers (leave empty for config default)"
    type: string
    default: " "
  - name: slowMode
    displayName: "Slow Mode (increases all timeouts and delays for slow environments)"
    type: boolean
    default: false

# Import shared variables
variables:
  - template: azure-pipelines/variables/common.yml
  - ${{ if eq(parameters.slowMode, true) }}:
    - name: SLOWMO
      value: "1500"
    - name: STABILITY_DELAY
      value: "1500"
    - name: ACTION_STABILITY_WAIT
      value: "1000"
    - name: SLOW_MODE
      value: "true"

stages:
  - stage: AcceptanceTests
    ${{ if or(eq(parameters.testCaseIds, ''), eq(parameters.testCaseIds, ' ')) }}:
      displayName: "Acceptance Tests [Filter: ${{ parameters.testFilter }}] [Env: ${{ parameters.environment }}] [Mode: ${{ parameters.executionMode }}]"
    ${{ else }}:
      displayName: "Acceptance Tests [IDs: ${{ parameters.testCaseIds }}] [Env: ${{ parameters.environment }}] [Mode: ${{ parameters.executionMode }}]"
    jobs:
      # === AZURE WORKSPACE MODE ===
      - ${{ if eq(parameters.executionMode, 'azure-workspace') }}:
        - template: azure-pipelines/templates/jobs/test-execution-job.yml
          parameters:
            jobName: "AcceptanceTests"
            displayName: "Acceptance Tests [Filter: ${{ parameters.testFilter }}]"
            condition: "true"
            environment: ${{ parameters.environment }}
            executionMode: "azure-workspace"
            configFile: "playwright.acceptance.config.ts"
            testPath: "staticTestcases"
            testFilter: ${{ parameters.testFilter }}
            testCaseIds: ${{ parameters.testCaseIds }}
            scheduleOverrideFilter: ""
            scheduleName: ""
            timeoutInMinutes: 90
            reportArtifactName: "acceptance-report"
            publishTraces: ${{ or(eq(parameters.reportingRun, true), false) }}
            reportingRun: ${{ parameters.reportingRun }}
            workers: ${{ parameters.workers }}

      # === LOCAL AGENT MODE ===
      - ${{ if eq(parameters.executionMode, 'local-agent') }}:
        - template: azure-pipelines/templates/jobs/test-execution-job.yml
          parameters:
            jobName: "AcceptanceTests"
            displayName: "Acceptance Tests [Filter: ${{ parameters.testFilter }}]"
            condition: "true"
            environment: ${{ parameters.environment }}
            executionMode: "local-agent"
            configFile: "playwright.acceptance-local.config.ts"
            testPath: "staticTestcases"
            testFilter: ${{ parameters.testFilter }}
            testCaseIds: ${{ parameters.testCaseIds }}
            scheduleOverrideFilter: ""
            scheduleName: ""
            timeoutInMinutes: 90
            reportArtifactName: "acceptance-report"
            publishTraces: true
            reportingRun: ${{ parameters.reportingRun }}
            workers: ${{ parameters.workers }}
